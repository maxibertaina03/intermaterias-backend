# Arma la imagen de producción del backend y la publica en GitHub Container Registry.
#
#   tag v2.2.1 (release)  ->  ghcr.io/maxibertaina03/intermaterias-backend:v2.2.1   (la que se despliega)
#   push a main           ->  ghcr.io/maxibertaina03/intermaterias-backend:main     (solo para probar)
#
# El VPS no construye nada: descarga la imagen con intermaterias-infra/produccion/scripts/deploy.sh.
name: Publicar imagen

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-imagen-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/maxibertaina03/intermaterias-backend

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # La etiqueta de la imagen es igual al tag de git (v2.2.1), para no confundirse al desplegar.
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

